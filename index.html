<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MindSpark - AI Powered Learning</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="manifest" href="./manifest-C28YfnE5.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eef2ff',
                100: '#e0e7ff',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
                900: '#312e81',
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-up': 'slideUp 0.4s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #475569;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
    </style>

  <p class="lead text-xl text-gray-600 dark:text-gray-300 mb-8">
    Artificial Intelligence is no longer a sci-fi concept; it's a daily tool for developers. From GitHub Copilot to ChatGPT, let's dive into the revolution.
  </p>

  <h2 id="the-rise-of-assistants">The Rise of Coding Assistants</h2>
  <p>
    Gone are the days of staring at a blank screen. AI assistants can now scaffold entire components, write unit tests, and even debug complex logic errors.
  </p>
  <figure class="my-8">
    <img src="https://picsum.photos/id/3/800/400" alt="Coding on a laptop" class="w-full rounded-xl shadow-lg">
    <figcaption class="text-center text-sm text-gray-500 mt-2">AI is the new pair programmer.</figcaption>
  </figure>

  <h2 id="generative-ui">Generative UI</h2>
  <p>
    Imagine describing a website interface in plain English and having it generated instantly. Tools like Vercel's v0 and Gemini are pushing these boundaries.
  </p>
  
  <blockquote class="border-l-4 border-brand-500 pl-4 italic my-6 text-gray-700 dark:text-gray-300">
    "The best code is no code. The second best is code written by AI under human supervision."
  </blockquote>

  <h3 id="what-stays-human">What Stays Human?</h3>
  <ul>
    <li><strong>Empathy:</strong> Understanding user pain points.</li>
    <li><strong>Creativity:</strong> Connecting dots that machines miss.</li>
    <li><strong>Architecture:</strong> Designing scalable systems.</li>
  </ul>

  <h2 id="conclusion">Conclusion</h2>

    Embrace the tools, but sharpen your fundamentals. The future belongs to those who can direct the AI, not just write syntax.
  </p>

  <p class="lead text-xl text-gray-600 dark:text-gray-300 mb-8">
    CSS Grid Layout is the most powerful layout system available in CSS. It is a 2-dimensional system, meaning it can handle both columns and rows.
  </p>

  <h2 id="grid-basics">The Basics</h2>
  <p>
    To get started you have to define a container element as a grid with <code>display: grid</code>, set the column and row sizes with <code>grid-template-columns</code> and <code>grid-template-rows</code>, and then place its child elements into the grid.
  </p>

  <pre><code class="language-css">.container {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 20px;
}</code></pre>

  <h2 id="fractional-units">Fractional Units (fr)</h2>
  <p>
    The <code>fr</code> unit is a flexible length which represents a fraction of the available space in the grid container.
  </p>
  
  <div class="grid grid-cols-3 gap-4 my-8 text-center text-white font-bold">
    <div class="bg-blue-500 p-4 rounded">1fr</div>
    <div class="bg-blue-600 p-4 rounded">1fr</div>
    <div class="bg-blue-700 p-4 rounded">1fr</div>
  </div>

  <h2 id="grid-areas">Grid Areas</h2>
  <p>
    You can name grid items and place them using templates. This is fantastic for full page layouts.
  </p>

  <table class="w-full text-left border-collapse my-6">
    <thead>
      <tr class="border-b border-gray-300 dark:border-gray-700">
        <th class="py-2">Property</th>
        <th class="py-2">Description</th>
      </tr>
    </thead>
    <tbody>
      <tr class="border-b border-gray-100 dark:border-gray-800">
        <td class="py-2 font-mono text-brand-600">grid-column</td>
        <td class="py-2">Shorthand for start/end column</td>
      </tr>
      <tr class="border-b border-gray-100 dark:border-gray-800">
        <td class="py-2 font-mono text-brand-600">grid-row</td>
        <td class="py-2">Shorthand for start/end row</td>
      </tr>
      <tr>
        <td class="py-2 font-mono text-brand-600">gap</td>
        <td class="py-2">Space between items</td>
      </tr>
    </tbody>
  </table>

  <h3 id="summary">Summary</h3>
  <p>
    CSS Grid is essential for modern responsive design. Combine it with Flexbox for 1D alignments within your grid cells!
  </p>
